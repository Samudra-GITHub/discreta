<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eae8e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171a19" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="DISCRETA: a laboratory for classical encryption, decryption, frequency analysis and cryptanalysis."
    />
    <title>DISCRETA</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash of the wrong one.
      ;(function () {
        var choice = 'system'
        try {
          choice = localStorage.getItem('discreta-theme') || 'system'
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
