<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-labelledby="t d">
  <title id="t">Moving results between the Cipher Workspace and the Analysis Lab</title>
  <desc id="d">A workspace result or message is sent to the Analysis Lab, which opens and runs the frequency analysis. A candidate from the Analysis Lab is sent back to the workspace, set to encrypt the candidate plaintext with the candidate key.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242620"/></marker></defs>
  <rect width="940" height="330" fill="#ffffff"/>
  <rect x="30" y="40" width="300" height="150" rx="6" fill="#f7f6f0" stroke="#8f8d80" stroke-width="1.2"/>
  <text x="42" y="62" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#242620">Cipher Workspace</text>
  <text x="42" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">cipher: Caesar · affine · Vigenère</text>
  <text x="42" y="99" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">operation: encrypt · decrypt</text>
  <text x="42" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">key controls, message, result</text>
  <text x="42" y="133" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">swap output into input</text>
  <rect x="610" y="40" width="300" height="150" rx="6" fill="#f7f6f0" stroke="#8f8d80" stroke-width="1.2"/>
  <text x="622" y="62" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#242620">Analysis Lab</text>
  <text x="622" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">one ciphertext shared by four tabs</text>
  <text x="622" y="99" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">Frequency · Caesar · Affine · Vigenère</text>
  <text x="622" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">inspect candidates</text>
  <text x="622" y="133" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">results kept while you navigate</text>
  <line x1="332" y1="90" x2="608" y2="90" stroke="#242620" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="470" y="78" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#626359">Send to Analysis Lab</text>
  <text x="470" y="106" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#626359">text, tab = Frequency, runs frequency analysis</text>
  <line x1="608" y1="150" x2="332" y2="150" stroke="#bc4a27" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="470" y="138" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#626359">Send to Cipher Workspace</text>
  <text x="470" y="166" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#626359">cipher + key + plaintext, operation = encrypt</text>
  <rect x="215" y="218" width="510" height="84" rx="6" fill="#ebe9df" stroke="#8f8d80" stroke-width="1.2"/>
  <text x="227" y="240" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#242620">Shared session, in memory</text>
  <text x="227" y="260" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">provided above the routes; survives navigation; never saved</text>
  <text x="227" y="277" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#626359">Clear (lab) empties text and results · Clear session (Settings) resets both</text>
  <line x1="180" y1="190" x2="300" y2="218" stroke="#242620" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="760" y1="190" x2="640" y2="218" stroke="#242620" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
